<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - AI智能瞭望与智能问数系统</title>
    <link rel="stylesheet" href="{{ static_url('dist/bootstrap-5.3.8-dist/css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ static_url('dist/fontawesome-free-5.15.4-web/css/all.min.css') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%); display: flex; align-items: center; justify-content: center; min-height: 100vh; position: relative; overflow: hidden; }
        body::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); z-index: 0; }
        .login-container { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 20px; }
        .login-card { background: rgba(255,255,255,0.95); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 40px 35px; backdrop-filter: blur(10px); }
        .login-header { text-align: center; margin-bottom: 35px; }
        .login-header .logo-icon { width: 60px; height: 60px; background: linear-gradient(135deg, #1e9fff 0%, #0d7bd4 100%); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; box-shadow: 0 8px 20px rgba(30,159,255,0.3); }
        .login-header .logo-icon i { font-size: 28px; color: #fff; }
        .login-header h1 { font-size: 22px; color: #333; font-weight: 600; margin-bottom: 8px; }
        .login-header p { font-size: 13px; color: #999; }
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; font-size: 14px; color: #555; margin-bottom: 8px; font-weight: 500; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #bbb; font-size: 16px; }
        .input-wrapper input { width: 100%; padding: 12px 14px 12px 42px; border: 2px solid #e8e8e8; border-radius: 8px; font-size: 14px; transition: all 0.3s; outline: none; background: #fafafa; }
        .input-wrapper input:focus { border-color: #1e9fff; background: #fff; box-shadow: 0 0 0 3px rgba(30,159,255,0.1); }
        .login-btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #1e9fff 0%, #0d7bd4 100%); border: none; border-radius: 8px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(30,159,255,0.4); }
        .error-msg { background: #fff2f0; border: 1px solid #ffccc7; border-radius: 6px; padding: 10px 16px; margin-bottom: 20px; color: #fa541c; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .extra-links { text-align: center; margin-top: 20px; font-size: 13px; color: #999; }
        .extra-links a { color: #1e9fff; text-decoration: none; margin: 0 8px; }
        .extra-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon"><i class="fas fa-robot"></i></div>
                <h1>用户登录</h1>
                <p>AI 智能瞭望与智能问数系统</p>
            </div>
            {% if error %}
            <div class="error-msg"><i class="fas fa-exclamation-circle"></i> {{ error }}</div>
            {% end %}
            <form method="post" action="/auth/login">
                {% module xsrf_form_html() %}
                <div class="form-group">
                    <label>用户名</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" name="username" placeholder="请输入用户名" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" placeholder="请输入密码" required>
                    </div>
                </div>
                <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> 登 录</button>
            </form>
            <div class="extra-links">
                还没有账号？<a href="/auth/register">立即注册</a>
            </div>
        </div>
    </div>
</body>
</html>
