<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>接口管理</title>
    <link rel="stylesheet" href="/static/dist/layui-v2.13.6/layui/css/layui.css">
</head>
<body class="layui-layout-body" style="padding: 15px;">
    <div class="layui-card">
        <div class="layui-card-header">接口管理</div>
        <div class="layui-card-body">
            <button class="layui-btn" id="btnAdd">新增接口</button>
            <table id="apiTable" lay-filter="apiTable"></table>
        </div>
    </div>

    <script src="/static/dist/layui-v2.13.6/layui/layui.js"></script>
    <script>
        layui.use(['table', 'form', 'layer', 'jquery'], function(){
            var table = layui.table, form = layui.form, layer = layui.layer, $ = layui.jquery;

            function getCookie(name) {
                var r = document.cookie.match("\\b" + name + "=([^;]*)\\b");
                return r ? r[1] : undefined;
            }

            $.ajaxSetup({
                beforeSend: function(xhr, settings) {
                    if (settings.type === 'POST') {
                        xhr.setRequestHeader("X-XSRFToken", getCookie("_xsrf"));
                    }
                }
            });

            table.render({
                elem: '#apiTable',
                url: '/admin/api/list',
                cols: [[
                    {field: 'id', title: 'ID', width: 80},
                    {field: 'name', title: '接口名称', width: 180},
                    {field: 'url', title: '接口地址'},
                    {field: 'method', title: '请求方式', width: 100, templet: function(d){
                        var cls = 'layui-badge';
                        if(d.method === 'GET') cls += ' layui-bg-green';
                        else if(d.method === 'POST') cls += ' layui-bg-blue';
                        else cls += ' layui-bg-orange';
                        return '<span class="' + cls + '">' + d.method + '</span>';
                    }},
                    {field: 'resp_format', title: '返回格式', width: 100},
                    {field: 'status', title: '状态', width: 100, templet: function(d){
                        return d.status === 1 ? '<span class="layui-badge layui-bg-green">启用</span>' : '<span class="layui-badge layui-bg-gray">禁用</span>';
                    }},
                    {field: 'create_at', title: '创建时间', width: 180},
                    {title: '操作', width: 150, templet: function(d){
                        return '<a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>' +
                               '<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>';
                    }}
                ]]
            });

            $('#btnAdd').click(function(){
                openApiForm('新增接口', {});
            });

            table.on('tool(apiTable)', function(obj){
                if(obj.event === 'edit'){
                    openApiForm('编辑接口', obj.data);
                } else if(obj.event === 'del'){
                    layer.confirm('确定删除该接口吗？', function(index){
                        $.post('/admin/api/delete', {id: obj.data.id}, function(res){
                            if(res.code === 0){
                                layer.msg('删除成功');
                                table.reload('apiTable');
                            } else {
                                layer.msg(res.msg);
                            }
                        });
                        layer.close(index);
                    });
                }
            });

            function openApiForm(title, data){
                layer.open({
                    type: 1,
                    title: title,
                    area: ['650px', '520px'],
                    content: `
                        <form class="layui-form" style="padding: 20px;">
                            <input type="hidden" name="id" value="${data.id || ''}">
                            <div class="layui-form-item">
                                <label class="layui-form-label">接口名称</label>
                                <div class="layui-input-block">
                                    <input type="text" name="name" required lay-verify="required" placeholder="请输入接口名称" class="layui-input" value="${data.name || ''}">
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">接口地址</label>
                                <div class="layui-input-block">
                                    <input type="text" name="url" required lay-verify="required" placeholder="请输入接口URL" class="layui-input" value="${data.url || ''}">
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">请求方式</label>
                                <div class="layui-input-block">
                                    <select name="method">
                                        <option value="GET">GET</option>
                                        <option value="POST">POST</option>
                                        <option value="PUT">PUT</option>
                                        <option value="DELETE">DELETE</option>
                                    </select>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">返回格式</label>
                                <div class="layui-input-block">
                                    <select name="resp_format">
                                        <option value="JSON">JSON</option>
                                        <option value="XML">XML</option>
                                        <option value="HTML">HTML</option>
                                        <option value="TEXT">TEXT</option>
                                    </select>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">QPS限制</label>
                                <div class="layui-input-block">
                                    <input type="number" name="qps_limit" placeholder="0表示无限制" class="layui-input" value="${data.qps_limit || 0}">
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">Token</label>
                                <div class="layui-input-block">
                                    <input type="text" name="token" placeholder="如需鉴权请填写" class="layui-input" value="${data.token || ''}">
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">描述</label>
                                <div class="layui-input-block">
                                    <textarea name="description" placeholder="接口描述信息" class="layui-textarea">${data.description || ''}</textarea>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">状态</label>
                                <div class="layui-input-block">
                                    <input type="radio" name="status" value="1" title="启用" checked>
                                    <input type="radio" name="status" value="0" title="禁用">
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-input-block">
                                    <button class="layui-btn" lay-submit lay-filter="apiSubmit">立即提交</button>
                                </div>
                            </div>
                        </form>
                    `,
                    success: function(layero, index){
                        form.render();
                        if(data.id){
                            $('select[name="method"]').val(data.method || 'GET');
                            $('select[name="resp_format"]').val(data.resp_format || 'JSON');
                            $('input[name="status"][value="' + (data.status !== undefined ? data.status : 1) + '"]').prop('checked', true);
                            form.render('select');
                            form.render('radio');
                        }
                        form.on('submit(apiSubmit)', function(formData){
                            var url = formData.field.id ? '/admin/api/update' : '/admin/api/add';
                            $.post(url, formData.field, function(res){
                                if(res.code === 0){
                                    layer.msg(res.msg);
                                    layer.close(index);
                                    table.reload('apiTable');
                                } else {
                                    layer.msg(res.msg);
                                }
                            });
                            return false;
                        });
                    }
                });
            }
        });
    </script>
</body>
</html>
