<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理系统 - AI智能瞭望与智能问数系统</title>
    <link rel="stylesheet" href="{{ static_url('dist/layui-v2.13.6/layui/css/layui.css') }}">
    <link rel="stylesheet" href="{{ static_url('dist/fontawesome-free-5.15.4-web/css/all.min.css') }}">
    <style>
        .layui-layout-admin .layui-header {
            background: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            height: 50px;
        }
        .layui-layout-admin .layui-header .layui-logo {
            color: #333;
            font-weight: 600;
            font-size: 16px;
            box-shadow: none;
            background: #fff;
            border-bottom: 1px solid #f0f0f0;
        }
        .layui-layout-admin .layui-header .layui-logo .logo-icon {
            display: inline-block;
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #1e9fff 0%, #0d7bd4 100%);
            border-radius: 6px;
            text-align: center;
            line-height: 28px;
            margin-right: 8px;
            vertical-align: middle;
        }
        .layui-layout-admin .layui-header .layui-logo .logo-icon i {
            color: #fff;
            font-size: 14px;
        }
        .layui-layout-admin .layui-side {
            top: 50px;
            background: #28333E;
        }
        .layui-layout-admin .layui-side .layui-logo {
            background: #28333E;
        }
        .layui-layout-admin .layui-body {
            top: 50px;
            bottom: 0;
        }
        .layui-layout-admin .layui-footer {
            background: #fff;
            border-top: 1px solid #f0f0f0;
            padding: 0 20px;
            font-size: 12px;
            color: #999;
        }
        .header-right {
            float: right;
            display: flex;
            align-items: center;
            height: 100%;
            padding-right: 15px;
        }
        .header-right .user-info {
            display: flex;
            align-items: center;
            padding: 0 12px;
            cursor: default;
            color: #555;
            font-size: 14px;
        }
        .header-right .user-info i {
            margin-right: 6px;
            color: #1e9fff;
        }
        .header-right .logout-btn {
            margin-left: 10px;
            color: #999;
            font-size: 16px;
            cursor: pointer;
            padding: 0 8px;
            height: 100%;
            display: flex;
            align-items: center;
        }
        .header-right .logout-btn:hover {
            color: #ff5722;
        }
        .layui-nav-tree .layui-nav-item a {
            color: rgba(255,255,255,0.7);
        }
        .layui-nav-tree .layui-nav-item a:hover {
            color: #fff;
        }
        .layui-nav-tree .layui-nav-item.layui-this a {
            color: #fff;
            background: #1e9fff;
        }
        .layui-nav-tree .layui-nav-item a .layui-icon {
            margin-right: 6px;
        }
        .page-header {
            background: #fff;
            padding: 15px 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        .page-header h2 {
            font-size: 18px;
            color: #333;
            margin: 0;
            font-weight: 500;
        }
        .page-header .breadcrumb {
            margin-top: 5px;
            font-size: 12px;
            color: #999;
        }
        .page-content {
            padding: 15px;
            height: calc(100% - 65px);
            overflow: auto;
        }
        .welcome-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
        }
        .welcome-page .welcome-icon {
            font-size: 80px;
            color: #1e9fff;
            margin-bottom: 20px;
        }
        .welcome-page h3 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }
        .welcome-page p {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="layui-layout layui-layout-admin">
        <div class="layui-header">
            <div class="layui-logo">
                <span class="logo-icon"><i class="fas fa-robot"></i></span>
                AI 智能瞭望系统
            </div>
            <div class="header-right">
                <div class="user-info">
                    <i class="fas fa-user-shield"></i>
                    <span>{{ username }}</span>
                </div>
                <form action="/admin/logout" method="post" style="display:inline;" id="logoutForm">
                    {% module xsrf_form_html() %}
                    <button type="button" class="logout-btn" title="退出登录" onclick="doLogout()">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </form>
            </div>
        </div>

        <div class="layui-side layui-bg-black">
            <div class="layui-side-scroll">
                <ul class="layui-nav layui-nav-tree" lay-filter="admin-nav" id="sideMenu">
                    <!-- 菜单动态加载 -->
                </ul>
            </div>
        </div>

        <div class="layui-body">
            <!-- 默认加载欢迎页，确保 URL 正确 -->
            <iframe id="mainFrame" src="/admin/home" frameborder="0" style="width:100%;height:100%;"></iframe>
        </div>

        <div class="layui-footer">
            Copyright © 2026 AI 智能瞭望与智能问数系统 版权所有
        </div>
    </div>

    <script src="{{ static_url('dist/layui-v2.13.6/layui/layui.js') }}"></script>
    <script>
        layui.use(['element', 'layer', 'jquery'], function(){
            var element = layui.element;
            var layer = layui.layer;
            var $ = layui.jquery;

            // 从 API 动态加载菜单
            $.get('/admin/menu', function(res) {
                if (res.code === 0 && res.data) {
                    var html = '';
                    res.data.forEach(function(item, index) {
                        html += '<li class="layui-nav-item' + (index === 0 ? ' layui-nav-itemed' : '') + '">';
                        html += '<a href="javascript:;"><i class="layui-icon ' + (item.icon || '') + '"></i>' + item.name + '</a>';
                        if (item.children && item.children.length > 0) {
                            html += '<dl class="layui-nav-child">';
                            item.children.forEach(function(child) {
                                html += '<dd' + (index === 0 && item.children.indexOf(child) === 0 ? ' class="layui-this"' : '') + '>';
                                html += '<a href="javascript:;" data-url="' + (child.url || '') + '" data-title="' + child.name + '">';
                                html += '<i class="layui-icon ' + (child.icon || '') + '"></i>' + child.name;
                                html += '</a></dd>';
                            });
                            html += '</dl>';
                        }
                        html += '</li>';
                    });
                    $('#sideMenu').html(html);
                    element.render('nav', 'admin-nav');
                }
            }, 'json');

            element.on('nav(admin-nav)', function(elem){
                var url = elem.attr('data-url');
                var title = elem.attr('data-title');
                if(url){
                    $('#mainFrame').attr('src', url);
                }
            });

            window.doLogout = function(){
                layer.confirm('确定要退出登录吗？', {icon: 3, title:'提示'}, function(index){
                    $('#logoutForm').submit();
                    layer.close(index);
                });
            };
        });
    </script>
</body>
</html>
