<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员登录 - AI智能瞭望与智能问数系统</title>
    <link rel="stylesheet" href="{{ static_url('dist/layui-v2.13.6/layui/css/layui.css') }}">
    <link rel="stylesheet" href="{{ static_url('dist/fontawesome-free-5.15.4-web/css/all.min.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            z-index: 0;
        }
        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px 35px;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
        }
        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .login-header .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #1e9fff 0%, #0d7bd4 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 20px rgba(30, 159, 255, 0.3);
        }
        .login-header .logo-icon i {
            font-size: 28px;
            color: #fff;
        }
        .login-header h1 {
            font-size: 22px;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .login-header p {
            font-size: 13px;
            color: #999;
        }
        .form-group {
            margin-bottom: 22px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 16px;
            transition: color 0.3s ease;
        }
        .input-wrapper input {
            width: 100%;
            height: 46px;
            padding: 0 14px 0 44px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            color: #333;
            background: #fafafa;
            transition: all 0.3s ease;
        }
        .input-wrapper input:focus {
            outline: none;
            border-color: #1e9fff;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(30, 159, 255, 0.1);
        }
        .input-wrapper input:focus + i,
        .input-wrapper input:focus ~ i {
            color: #1e9fff;
        }
        .login-btn {
            width: 100%;
            height: 46px;
            background: linear-gradient(135deg, #1e9fff 0%, #0d7bd4 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .login-btn:hover {
            background: linear-gradient(135deg, #0d7bd4 0%, #0967b3 100%);
            box-shadow: 0 6px 20px rgba(30, 159, 255, 0.4);
            transform: translateY(-2px);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .error-tip {
            background: #fff2f0;
            border: 1px solid #ffccc7;
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 20px;
            color: #ff4d4f;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .error-tip i {
            font-size: 16px;
        }
        .login-footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }
        .login-footer p {
            font-size: 12px;
            color: #bbb;
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 25px;
            }
            .login-header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">
                    <i class="fas fa-shield-alt"></i>
                </div>
                <h1>后台管理系统</h1>
                <p>AI 智能瞭望与智能问数系统</p>
            </div>

            {% if error %}
            <div class="error-tip">
                <i class="fas fa-exclamation-circle"></i>
                <span>{{ error }}</span>
            </div>
            {% end %}

            <form method="post" action="/admin/login" id="loginForm">
                {% module xsrf_form_html() %}
                <div class="form-group">
                    <label>管理员账号</label>
                    <div class="input-wrapper">
                        <input type="text" name="username" placeholder="请输入管理员账号" autocomplete="off" required>
                        <i class="fas fa-user"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>登录密码</label>
                    <div class="input-wrapper">
                        <input type="password" name="password" placeholder="请输入登录密码" autocomplete="off" required>
                        <i class="fas fa-lock"></i>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> 登 录
                </button>
            </form>

            <div class="login-footer">
                <p>Copyright © 2026 AI 智能瞭望系统 版权所有</p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function() {
            var btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 登录中...';
        });
    </script>
</body>
</html>
