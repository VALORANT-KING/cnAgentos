<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统首页</title>
    <link rel="stylesheet" href="/static/dist/layui-v2.13.6/layui/css/layui.css">
    <link rel="stylesheet" href="/static/dist/fontawesome-free-5.15.4-web/css/all.min.css">
    <style>
        .welcome-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 400px;
            color: #666;
        }
        .welcome-icon {
            font-size: 80px;
            color: #1e9fff;
            margin-bottom: 20px;
        }
        .welcome-page h3 {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }
        .welcome-page p {
            font-size: 14px;
            color: #999;
        }
        .stats-row {
            margin-top: 40px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px 30px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            text-align: center;
            min-width: 150px;
        }
        .stat-card .stat-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #333;
        }
        .stat-card .stat-label {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="welcome-page">
        <div class="welcome-icon">
            <i class="fas fa-rocket"></i>
        </div>
        <h3>欢迎使用 AI 智能瞭望与智能问数系统</h3>
        <p>后台管理模块正在开发中，敬请期待...</p>

        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-icon" style="color:#1e9fff;"><i class="fas fa-users"></i></div>
                <div class="stat-value">--</div>
                <div class="stat-label">用户总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color:#5fb878;"><i class="fas fa-robot"></i></div>
                <div class="stat-value">--</div>
                <div class="stat-label">数字员工</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color:#ffb800;"><i class="fas fa-database"></i></div>
                <div class="stat-value">--</div>
                <div class="stat-label">数据源</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="color:#ff5722;"><i class="fas fa-eye"></i></div>
                <div class="stat-value">--</div>
                <div class="stat-label">瞭望任务</div>
            </div>
        </div>
    </div>
</body>
</html>
