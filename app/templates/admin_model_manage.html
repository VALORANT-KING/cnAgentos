<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型引擎</title>
    <link rel="stylesheet" href="/static/dist/layui-v2.13.6/layui/css/layui.css">
    <link rel="stylesheet" href="/static/dist/fontawesome-free-5.15.4-web/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0a0e17;
            --bg-card: rgba(20, 28, 45, 0.9);
            --accent: #00d4ff;
            --accent2: #7b61ff;
            --accent3: #ff6b9d;
            --text-primary: #e0e6f0;
            --text-secondary: #8899b4;
            --border: rgba(0, 212, 255, 0.15);
            --glow: 0 0 20px rgba(0, 212, 255, 0.15);
            --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }
        body { padding: 0; margin: 0; background: var(--bg-dark); font-family: "Microsoft YaHei", sans-serif; min-height: 100vh; }

        .page-header {
            background: linear-gradient(135deg, rgba(20, 28, 45, 0.95), rgba(10, 14, 23, 0.98));
            padding: 18px 28px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        .page-header h2 {
            font-size: 18px;
            color: var(--text-primary);
            margin: 0;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .page-header h2 i { color: var(--accent); margin-right: 10px; }

        .page-content { padding: 24px 20px; }
        .toolbar { margin-bottom: 20px; display: flex; gap: 12px; }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none;
            color: #fff;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 212, 255, 0.3);
        }

        .model-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .model-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            overflow: hidden;
        }
        .model-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent3));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .model-card:hover::before { opacity: 1; }
        .model-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--glow), var(--card-shadow);
            border-color: rgba(0, 212, 255, 0.3);
        }
        .model-card.is-default {
            border-color: rgba(123, 97, 255, 0.35);
            box-shadow: 0 0 24px rgba(123, 97, 255, 0.15);
        }
        .model-card.disabled {
            opacity: 0.5;
            filter: grayscale(0.5);
        }

        .card-badges {
            position: absolute;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 8px;
        }
        .badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
        }
        .badge-default {
            background: linear-gradient(135deg, #7b61ff, #a78bfa);
            color: #fff;
        }
        .badge-remote {
            background: rgba(0, 212, 255, 0.15);
            color: var(--accent);
        }
        .badge-local {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
        }
        .badge-provider {
            background: rgba(255, 107, 157, 0.12);
            color: var(--accent3);
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 14px;
        }
        .card-icon.remote { background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(0,180,230,0.1)); color: var(--accent); }
        .card-icon.local { background: linear-gradient(135deg, rgba(52,211,153,0.15), rgba(40,180,130,0.1)); color: #34d399; }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-model-name {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-family: 'Consolas', 'Courier New', monospace;
            background: rgba(0,0,0,0.2);
            padding: 2px 8px;
            border-radius: 4px;
            display: inline-block;
        }
        .card-desc {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 14px;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 36px;
        }

        .token-stats {
            display: flex;
            gap: 12px;
            padding: 10px 0;
            border-top: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 14px;
        }
        .token-stat {
            flex: 1;
            text-align: center;
        }
        .token-stat .value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'Consolas', monospace;
        }
        .token-stat .label {
            font-size: 10px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .token-bar {
            height: 3px;
            border-radius: 3px;
            background: rgba(255,255,255,0.06);
            margin-bottom: 14px;
            overflow: hidden;
        }
        .token-bar-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            transition: width 0.6s ease;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .card-actions .layui-btn {
            font-size: 12px;
            height: 28px;
            line-height: 28px;
            padding: 0 12px;
            border-radius: 6px;
        }

        .layui-btn-chat {
            background: linear-gradient(135deg, var(--accent), #0098cc);
            border-color: transparent;
            color: #fff;
        }
        .layui-btn-chat:hover { opacity: 0.9; }

        #pagination { text-align: center; padding: 30px 0; }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }
        .empty-state i { font-size: 64px; color: rgba(0,212,255,0.2); margin-bottom: 16px; display: block; }

        /* Chat Dialog */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 460px;
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-msg {
            max-width: 80%;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.6;
            word-break: break-word;
        }
        .chat-msg.user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--accent), #0098cc);
            color: #fff;
            border-bottom-right-radius: 4px;
        }
        .chat-msg.assistant {
            align-self: flex-start;
            background: rgba(255,255,255,0.06);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }
        .chat-msg .msg-meta {
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 4px;
        }
        .chat-input-area {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.2);
        }
        .chat-input-area textarea {
            flex: 1;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            padding: 10px;
            font-size: 13px;
            resize: none;
            height: 40px;
            outline: none;
            transition: border-color 0.3s;
        }
        .chat-input-area textarea:focus { border-color: var(--accent); }
        .chat-input-area .send-btn {
            padding: 0 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .chat-input-area .send-btn:hover { opacity: 0.9; transform: scale(1.02); }
        .chat-input-area .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .typing-indicator { color: var(--accent); font-size: 12px; padding: 4px 0; }
        .typing-indicator .dot { animation: blink 1.4s infinite both; }
        .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0%{opacity:0.2} 20%{opacity:1} 100%{opacity:0.2} }

        @media (max-width: 1200px) {
            .model-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .model-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="page-header">
        <h2><i class="layui-icon layui-icon-engine"></i>模型引擎配置中心</h2>
    </div>

    <div class="page-content">
        <div class="toolbar">
            <button class="btn-primary" id="btnAdd">
                <i class="layui-icon layui-icon-addition"></i> 接入新模型
            </button>
        </div>

        <div class="model-grid" id="modelGrid"></div>
        <div id="pagination"></div>
    </div>

    <div id="modelFormBox" style="display:none;">
        <div style="padding:24px;">
            <form class="layui-form" id="modelForm" lay-filter="modelForm">
                <input type="hidden" name="id">
                <div class="layui-form-item">
                    <label class="layui-form-label" style="width:90px;">模型名称</label>
                    <div class="layui-input-block" style="margin-left:120px;">
                        <input type="text" name="name" required lay-verify="required" placeholder="如：GPT-3.5 Turbo" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" style="width:90px;">服务商</label>
                    <div class="layui-input-block" style="margin-left:120px;">
                        <select name="provider">
                            <option value="openai">OpenAI</option>
                            <option value="deepseek">DeepSeek</option>
                            <option value="qwen">Qwen / 通义千问</option>
                            <option value="local">本地部署</option>
                            <option value="custom">自定义</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" style="width:90px;">API 地址</label>
                    <div class="layui-input-block" style="margin-left:120px;">
                        <input type="text" name="base_url" required placeholder="https://api.openai.com/v1" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" style="width:90px;">API Key</label>
                    <div class="layui-input-block" style="margin-left:120px;">
                        <input type="password" name="api_key" placeholder="sk-..." class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" style="width:90px;">模型标识</label>
                    <div class="layui-input-block" style="margin-left:120px;">
                        <input type="text" name="model_name" required placeholder="gpt-3.5-turbo / deepseek-v3.2-exp" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" style="width:90px;">模型类型</label>
                    <div class="layui-input-block" style="margin-left:120px;">
                        <select name="type">
                            <option value="remote">远程云端</option>
                            <option value="local">本地部署</option>
                        </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" style="width:90px;">最大 Tokens</label>
                    <div class="layui-input-block" style="margin-left:120px;">
                        <input type="number" name="max_tokens" value="2048" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" style="width:90px;">Temperature</label>
                    <div class="layui-input-block" style="margin-left:120px;">
                        <input type="number" name="temperature" value="0.7" step="0.1" min="0" max="2" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item" id="statusFormItem" style="display:none;">
                    <label class="layui-form-label" style="width:90px;">状态</label>
                    <div class="layui-input-block" style="margin-left:120px;">
                        <input type="radio" name="status" value="1" title="启用">
                        <input type="radio" name="status" value="0" title="禁用">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label" style="width:90px;">描述</label>
                    <div class="layui-input-block" style="margin-left:120px;">
                        <textarea name="description" placeholder="模型描述..." class="layui-textarea" style="min-height:60px;"></textarea>
                    </div>
                </div>
                <div class="layui-form-item" style="display:none;">
                    <button class="layui-btn" lay-submit lay-filter="modelSubmit" id="realSubmit">提交</button>
                </div>
            </form>
        </div>
    </div>

    <div id="chatBox" style="display:none;">
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-msg assistant">
                    <div class="msg-meta">AI 助手</div>
                    <div>您好！我是基于当前模型的 AI 助手，请输入您的问题进行对话测试。</div>
                </div>
            </div>
            <div class="chat-input-area">
                <textarea id="chatInput" placeholder="输入测试消息..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn"><i class="layui-icon layui-icon-send"></i> 发送</button>
            </div>
        </div>
    </div>

    <script src="/static/dist/layui-v2.13.6/layui/layui.js"></script>
    <script>
        layui.use(['layer', 'form', 'jquery', 'laypage', 'element'], function(){
            var layer = layui.layer, form = layui.form, $ = layui.jquery, laypage = layui.laypage;

            function getCookie(n) { var r = document.cookie.match("\\b" + n + "=([^;]*)\\b"); return r ? r[1] : undefined; }
            $.ajaxSetup({ beforeSend: function(xhr, s) { if (s.type === 'POST') { var x = getCookie("_xsrf"); if (x) xhr.setRequestHeader("X-XSRFToken", x); } } });

            var currentPage = 1, pageSize = 6;

            function formatTokens(n) {
                if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
                if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
                return String(n || 0);
            }

            function formatCount(n) {
                if (n >= 10000) return (n / 10000).toFixed(1) + 'w';
                if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
                return String(n || 0);
            }

            function renderCards(engines, total) {
                var $grid = $('#modelGrid');
                $grid.empty();

                if (!engines || engines.length === 0) {
                    $grid.html('<div class="empty-state"><i class="layui-icon layui-icon-engine"></i><div style="font-size:16px;margin-top:8px;">暂无模型配置</div><div style="font-size:12px;color:var(--text-secondary);">点击"接入新模型"开始配置您的 AI 模型服务</div></div>');
                    $('#pagination').empty();
                    return;
                }

                engines.forEach(function(e) {
                    var isDefault = e.is_default === 1;
                    var isDisabled = e.status === 0;
                    var typeIcon = e.type === 'local' ? '<i class="fas fa-server"></i>' : '<i class="fas fa-cloud"></i>';
                    var typeClass = e.type === 'local' ? 'local' : 'remote';
                    var typeLabel = e.type === 'local' ? '本地部署' : '远程云端';
                    var providerLabel = e.provider || 'openai';

                    var badgesHtml = '';
                    if (isDefault) badgesHtml += '<span class="badge badge-default">默认</span>';
                    badgesHtml += '<span class="badge badge-provider">' + providerLabel + '</span>';
                    badgesHtml += '<span class="badge badge-' + typeClass + '">' + typeLabel + '</span>';

                    var cardClass = 'model-card';
                    if (isDefault) cardClass += ' is-default';
                    if (isDisabled) cardClass += ' disabled';

                    var actionsHtml = '';
                    actionsHtml += '<button class="layui-btn layui-btn-chat layui-btn-xs" data-action="chat" data-id="' + e.id + '" data-name="' + e.name + '"><i class="layui-icon layui-icon-dialogue"></i> 对话测试</button>';
                    actionsHtml += '<button class="layui-btn layui-btn-xs" data-action="edit" data-id="' + e.id + '"><i class="layui-icon layui-icon-edit"></i> 编辑</button>';
                    if (!isDefault) {
                        actionsHtml += '<button class="layui-btn layui-btn-xs layui-btn-normal" data-action="setdefault" data-id="' + e.id + '" data-name="' + e.name + '"><i class="layui-icon layui-icon-star"></i> 设为默认</button>';
                        actionsHtml += '<button class="layui-btn layui-btn-danger layui-btn-xs" data-action="delete" data-id="' + e.id + '" data-name="' + e.name + '"><i class="layui-icon layui-icon-delete"></i> 删除</button>';
                    }

                    var cardHtml = '<div class="' + cardClass + '" data-id="' + e.id + '">' +
                        '<div class="card-badges">' + badgesHtml + '</div>' +
                        '<div class="card-icon ' + typeClass + '">' + typeIcon + '</div>' +
                        '<div class="card-title">' + e.name + '</div>' +
                        '<div class="card-model-name">' + (e.model_name || '-') + '</div>' +
                        '<div class="card-desc">' + (e.description || '暂无描述') + '</div>' +
                        '<div class="token-bar"><div class="token-bar-fill" style="width:' + Math.min((e.total_tokens || 0) / 1000 * 10, 100) + '%"></div></div>' +
                        '<div class="token-stats">' +
                            '<div class="token-stat"><div class="value">' + formatTokens(e.total_tokens || 0) + '</div><div class="label">Token 消耗</div></div>' +
                            '<div class="token-stat"><div class="value">' + formatCount(e.request_count || 0) + '</div><div class="label">调用次数</div></div>' +
                            '<div class="token-stat"><div class="value">' + (e.max_tokens || 2048) + '</div><div class="label">上限 Token</div></div>' +
                        '</div>' +
                        '<div class="card-actions">' + actionsHtml + '</div>' +
                    '</div>';

                    $grid.append(cardHtml);
                });

                laypage.render({
                    elem: 'pagination',
                    count: total || 0,
                    limit: pageSize,
                    curr: currentPage,
                    layout: ['prev', 'page', 'next', 'count'],
                    prev: '<i class="layui-icon layui-icon-prev"></i>',
                    next: '<i class="layui-icon layui-icon-next"></i>',
                    jump: function(obj, first) {
                        if (!first) {
                            currentPage = obj.curr;
                            loadEngines();
                        }
                    }
                });
            }

            function loadEngines() {
                $.get('/admin/model/list', { page: currentPage, limit: pageSize }, function(res) {
                    if (res.code === 0) {
                        renderCards(res.data, res.count);
                    }
                }, 'json');
            }

            loadEngines();

            // Open form dialog
            function openFormDialog(title, data) {
                var isEdit = !!data;
                var content = $('#modelFormBox').html();

                layer.open({
                    type: 1, title: title, area: ['560px', isEdit ? '540px' : '520px'],
                    content: content, btn: ['确定', '取消'],
                    success: function(layero, index) {
                        form.render(null, 'modelForm');
                        if (isEdit) {
                            form.val('modelForm', data);
                            $(layero).find('#statusFormItem').show();
                            if (data.status !== undefined) {
                                $(layero).find('input[name="status"][value="' + data.status + '"]').prop('checked', true);
                            }
                            form.render('radio');
                        } else {
                            $(layero).find('#statusFormItem').hide();
                        }

                        form.on('submit(modelSubmit)', function(formData) {
                            var url = isEdit ? '/admin/model/update' : '/admin/model/add';
                            $.post(url, formData.field, function(res) {
                                layer.msg(res.msg, { icon: res.code === 0 ? 1 : 2 });
                                if (res.code === 0) {
                                    layer.close(layer.index);
                                    loadEngines();
                                }
                            }, 'json');
                            return false;
                        });
                    },
                    yes: function(idx, layero) { $(layero).find('#realSubmit').click(); }
                });
            }

            // Buttons
            $('#btnAdd').on('click', function() { openFormDialog('接入新模型'); });

            // Card actions (event delegation)
            var engineCache = {};
            $(document).on('click', '[data-action]', function() {
                var action = $(this).data('action');
                var id = $(this).data('id');
                var name = $(this).data('name');

                if (action === 'edit') {
                    $.get('/admin/model/list', { page: 1, limit: 100 }, function(res) {
                        var found = null;
                        if (res.data) {
                            res.data.forEach(function(e) { if (e.id === id) found = e; });
                        }
                        if (found) openFormDialog('编辑模型 - ' + found.name, found);
                    });
                } else if (action === 'delete') {
                    layer.confirm('确定要删除模型 "' + name + '" 吗？', { icon: 2 }, function(index) {
                        $.post('/admin/model/delete', { id: id }, function(res) {
                            layer.msg(res.msg, { icon: res.code === 0 ? 1 : 2 });
                            if (res.code === 0) loadEngines();
                        }, 'json');
                        layer.close(index);
                    });
                } else if (action === 'setdefault') {
                    layer.confirm('将 "' + name + '" 设为系统默认模型？设为默认后全局优先调用此模型。', { icon: 3 }, function(index) {
                        $.post('/admin/model/setdefault', { id: id }, function(res) {
                            layer.msg(res.msg, { icon: res.code === 0 ? 1 : 2 });
                            if (res.code === 0) loadEngines();
                        }, 'json');
                        layer.close(index);
                    });
                } else if (action === 'chat') {
                    openChatDialog(id, name);
                }
            });

            // Chat Dialog with SSE streaming
            function openChatDialog(engineId, engineName) {
                var chatIndex;
                var isStreaming = false;

                chatIndex = layer.open({
                    type: 1,
                    title: '对话测试 - ' + engineName,
                    area: ['680px', '560px'],
                    content: $('#chatBox').html(),
                    btn: ['清空对话', '关闭'],
                    success: function(layero) {
                        var $messages = $(layero).find('#chatMessages');
                        var $input = $(layero).find('#chatInput');
                        var $sendBtn = $(layero).find('#sendBtn');

                        function addMessage(role, content) {
                            var cls = role === 'user' ? 'user' : 'assistant';
                            var meta = role === 'user' ? '我' : 'AI 助手';
                            var msgEl = $('<div class="chat-msg ' + cls + '"><div class="msg-meta">' + meta + '</div><div class="msg-body">' + content + '</div></div>');
                            $messages.append(msgEl);
                            $messages.scrollTop($messages[0].scrollHeight);
                            return msgEl;
                        }

                        function sendMessage() {
                            var msg = $input.val().trim();
                            if (!msg || isStreaming) return;

                            isStreaming = true;
                            $sendBtn.prop('disabled', true);
                            addMessage('user', msg);
                            $input.val('');

                            var assistantMsg = addMessage('assistant', '');
                            var $msgBody = assistantMsg.find('.msg-body');
                            var typingEl = $('<span class="typing-indicator">思考中<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></span>');
                            $msgBody.append(typingEl);

                            var xsrftoken = getCookie('_xsrf');
                            var xhr = new XMLHttpRequest();
                            xhr.open('POST', '/admin/model/chatstream', true);
                            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                            if (xsrftoken) xhr.setRequestHeader('X-XSRFToken', xsrftoken);

                            var fullContent = '';
                            var lastIndex = 0;

                            xhr.onprogress = function() {
                                var newData = xhr.responseText.substring(lastIndex);
                                lastIndex = xhr.responseText.length;
                                var lines = newData.split('\n');
                                for (var i = 0; i < lines.length; i++) {
                                    var line = lines[i].trim();
                                    if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                                        try {
                                            var data = JSON.parse(line.substring(6));
                                            if (data.content) {
                                                typingEl.remove();
                                                fullContent += data.content;
                                                $msgBody.text(fullContent);
                                                $messages.scrollTop($messages[0].scrollHeight);
                                            }
                                            if (data.error) {
                                                typingEl.remove();
                                                $msgBody.html('<span style="color:#ff6b9d;">错误: ' + data.error + '</span>');
                                                isStreaming = false;
                                                $sendBtn.prop('disabled', false);
                                            }
                                        } catch(e) {}
                                    } else if (line === 'data: [DONE]') {
                                        isStreaming = false;
                                        $sendBtn.prop('disabled', false);
                                        loadEngines();
                                    }
                                }
                            };

                            xhr.onload = function() {
                                isStreaming = false;
                                $sendBtn.prop('disabled', false);
                                loadEngines();
                            };

                            xhr.onerror = function() {
                                typingEl.remove();
                                $msgBody.html('<span style="color:#ff6b9d;">连接失败，请检查模型配置</span>');
                                isStreaming = false;
                                $sendBtn.prop('disabled', false);
                            };

                            xhr.send('id=' + engineId + '&message=' + encodeURIComponent(msg) + '&_xsrf=' + (xsrftoken || ''));
                        }

                        $sendBtn.on('click', sendMessage);
                        $input.on('keydown', function(e) {
                            if (e.key === 'Enter' && !e.shiftKey) {
                                e.preventDefault();
                                sendMessage();
                            }
                        });
                    },
                    btn1: function(idx, layero) {
                        $(layero).find('#chatMessages').html(
                            '<div class="chat-msg assistant"><div class="msg-meta">AI 助手</div><div>对话已清空，请输入新的问题。</div></div>'
                        );
                        return false;
                    },
                    btn2: function(idx) { layer.close(idx); }
                });
            }
        });
    </script>
</body>
</html>
