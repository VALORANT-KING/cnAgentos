<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>聊天记录</title>
    <link rel="stylesheet" href="/static/dist/layui-v2.13.6/layui/css/layui.css">
    <style>
        .im-admin-msg-box {
            max-height: 520px;
            overflow-y: auto;
            padding: 12px 16px;
            background: #f5f5f5;
        }
        .im-admin-msg-item {
            margin-bottom: 12px;
            padding: 10px 12px;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        .im-admin-msg-meta {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }
        .im-admin-msg-meta b {
            color: #333;
        }
        .im-admin-msg-content {
            font-size: 14px;
            color: #333;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .im-admin-msg-type {
            display: inline-block;
            margin-left: 8px;
            padding: 0 6px;
            font-size: 11px;
            color: #1890ff;
            background: #e6f7ff;
            border-radius: 3px;
        }
    </style>
</head>
<body class="layui-layout-body" style="padding: 15px;">
    <div class="layui-card">
        <div class="layui-card-header">智能聊天 - 聊天记录（风控审计）</div>
        <div class="layui-card-body">
            <div class="layui-form layui-form-pane" style="margin-bottom:10px;">
                <div class="layui-inline">
                    <select id="receiverType" class="layui-input">
                        <option value="">全部类型</option>
                        <option value="user">私聊</option>
                        <option value="group">群聊</option>
                    </select>
                </div>
                <div class="layui-inline">
                    <input type="text" id="username" placeholder="用户名" class="layui-input">
                </div>
                <div class="layui-inline">
                    <input type="text" id="groupKeyword" placeholder="群名称" class="layui-input">
                </div>
                <div class="layui-inline">
                    <input type="text" id="keyword" placeholder="消息内容关键词" class="layui-input">
                </div>
                <div class="layui-inline">
                    <button class="layui-btn" id="btnSearch">搜索</button>
                    <button class="layui-btn layui-btn-primary" id="btnReset">重置</button>
                </div>
            </div>
            <table id="msgTable" lay-filter="msgTable"></table>
        </div>
    </div>

    <script src="/static/dist/layui-v2.13.6/layui/layui.js"></script>
    <script>
        layui.use(['table', 'layer', 'jquery'], function(){
            var table = layui.table, layer = layui.layer, $ = layui.jquery;

            function getCookie(name) {
                var r = document.cookie.match("\\b" + name + "=([^;]*)\\b");
                return r ? r[1] : undefined;
            }
            $.ajaxSetup({
                beforeSend: function(xhr, settings) {
                    if (settings.type === 'POST') {
                        xhr.setRequestHeader("X-XSRFToken", getCookie("_xsrf"));
                    }
                }
            });

            function getQuery(name) {
                var m = location.search.match(new RegExp('[?&]' + name + '=([^&]*)'));
                return m ? decodeURIComponent(m[1]) : '';
            }

            var initGroupId = getQuery('group_id');
            var initUserId = getQuery('user_id');

            function msgTypeLabel(type) {
                var map = {
                    text: '文本',
                    file: '文件',
                    sticker: '表情',
                    employee_call: '数字员工',
                    emoji: 'Emoji'
                };
                return map[type] || type || '文本';
            }

            function renderMessageContent(msg) {
                if (msg.msg_type === 'file' || Number(msg.file_id) > 0) {
                    return escapeHtml(msg.content || '[文件]');
                }
                if (msg.msg_type === 'sticker') return '[动画表情]';
                if (msg.msg_type === 'employee_call') return escapeHtml(msg.content || '[数字员工回复]');
                return escapeHtml(msg.content || '');
            }

            function escapeHtml(text) {
                var div = document.createElement('div');
                div.textContent = text || '';
                return div.innerHTML;
            }

            function openConversation(row) {
                var params = {
                    receiver_type: row.view_receiver_type,
                    receiver_id: row.view_receiver_type === 'group'
                        ? row.view_receiver_id
                        : row.view_user_id,
                    peer_user_id: row.view_peer_user_id || 0
                };
                var loadIdx = layer.load(1);
                $.get('/admin/im/messages/history', params, function(res){
                    layer.close(loadIdx);
                    if (res.code !== 0) return layer.msg(res.msg || '加载失败');
                    var title = res.data.title || '会话记录';
                    var html = '<div class="im-admin-msg-box">';
                    if (!res.data.messages || !res.data.messages.length) {
                        html += '<p style="color:#999;text-align:center;padding:40px 0;">暂无消息</p>';
                    } else {
                        res.data.messages.forEach(function(msg){
                            html += '<div class="im-admin-msg-item">' +
                                '<div class="im-admin-msg-meta">' +
                                '<b>' + escapeHtml(msg.sender_name || '未知') + '</b>' +
                                '<span class="im-admin-msg-type">' + msgTypeLabel(msg.msg_type) + '</span>' +
                                ' · ' + escapeHtml(msg.create_at || '') +
                                '</div>' +
                                '<div class="im-admin-msg-content">' + renderMessageContent(msg) + '</div>' +
                                '</div>';
                        });
                    }
                    html += '</div>';
                    layer.open({
                        type: 1,
                        title: title,
                        area: ['720px', '620px'],
                        content: html,
                        shadeClose: true
                    });
                });
            }

            var tableWhere = {};
            if (initGroupId) {
                tableWhere.group_id = initGroupId;
                $('#receiverType').val('group');
            }
            if (initUserId) {
                tableWhere.user_id = initUserId;
            }

            table.render({
                elem: '#msgTable',
                url: '/admin/im/messages/list',
                where: tableWhere,
                cols: [[
                    {field: 'id', title: 'ID', width: 70},
                    {field: 'chat_type', title: '类型', width: 70},
                    {field: 'conversation_name', title: '会话', width: 180},
                    {field: 'sender_name', title: '发送者', width: 120},
                    {field: 'msg_type', title: '消息类型', width: 100, templet: function(d){
                        return msgTypeLabel(d.msg_type);
                    }},
                    {field: 'content_preview', title: '内容预览'},
                    {field: 'create_at', title: '发送时间', width: 170},
                    {title: '操作', width: 120, templet: function(){
                        return '<a class="layui-btn layui-btn-xs" lay-event="view">查看会话</a>';
                    }}
                ]]
            });

            function reloadTable() {
                table.reload('msgTable', {
                    where: {
                        receiver_type: $('#receiverType').val(),
                        username: $('#username').val(),
                        group_keyword: $('#groupKeyword').val(),
                        keyword: $('#keyword').val(),
                        group_id: initGroupId || 0,
                        user_id: initUserId || 0
                    },
                    page: {curr: 1}
                });
            }

            $('#btnSearch').click(reloadTable);
            $('#btnReset').click(function(){
                $('#receiverType').val('');
                $('#username').val('');
                $('#groupKeyword').val('');
                $('#keyword').val('');
                initGroupId = '';
                initUserId = '';
                reloadTable();
            });

            table.on('tool(msgTable)', function(obj){
                if (obj.event === 'view') {
                    openConversation(obj.data);
                }
            });
        });
    </script>
</body>
</html>
