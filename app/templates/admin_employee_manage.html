<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>数字员工管理</title>
    <link rel="stylesheet" href="/static/dist/layui-v2.13.6/layui/css/layui.css">
</head>
<body class="layui-layout-body" style="padding: 15px;">
    <div class="layui-card">
        <div class="layui-card-header">数字员工管理</div>
        <div class="layui-card-body">
            <button class="layui-btn" id="btnAdd">新增员工</button>
            <table id="employeeTable" lay-filter="employeeTable"></table>
        </div>
    </div>

    <script src="/static/dist/layui-v2.13.6/layui/layui.js"></script>
    <script>
        layui.use(['table', 'form', 'layer', 'jquery'], function(){
            var table = layui.table, form = layui.form, layer = layui.layer, $ = layui.jquery;

            function getCookie(name) {
                var r = document.cookie.match("\\b" + name + "=([^;]*)\\b");
                return r ? r[1] : undefined;
            }

            $.ajaxSetup({
                beforeSend: function(xhr, settings) {
                    if (settings.type === 'POST') {
                        xhr.setRequestHeader("X-XSRFToken", getCookie("_xsrf"));
                    }
                }
            });

            table.render({
                elem: '#employeeTable',
                url: '/admin/employee/list',
                cols: [[
                    {field: 'id', title: 'ID', width: 60},
                    {field: 'name', title: '名称', width: 120},
                    {field: 'alias', title: '别名', width: 120},
                    {field: 'category', title: '分类', width: 80, templet: function(d){
                        return d.category === 'AI' ? '<span class="layui-badge layui-bg-blue">AI</span>' : '<span class="layui-badge layui-bg-green">普通</span>';
                    }},
                    {field: 'agent_type', title: '类型', width: 80, templet: function(d){
                        return d.agent_type === 'chat' ? '<span class="layui-badge">chat</span>' : '<span class="layui-badge layui-bg-orange">api</span>';
                    }},
                    {field: 'icon', title: '图标', width: 60, templet: function(d){
                        return '<i class="fas ' + (d.icon || 'fa-robot') + '"></i>';
                    }},
                    {field: 'description', title: '说明'},
                    {field: 'status', title: '状态', width: 80, templet: function(d){
                        return d.status === 1 ? '<span class="layui-badge layui-bg-green">启用</span>' : '<span class="layui-badge layui-bg-gray">禁用</span>';
                    }},
                    {field: 'create_at', title: '创建时间', width: 170},
                    {title: '操作', width: 220, templet: function(d){
                        return '<a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>' +
                               '<a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="tools">绑定工具</a>' +
                               '<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>';
                    }}
                ]]
            });

            $('#btnAdd').click(function(){
                openEmployeeForm('新增员工', {});
            });

            table.on('tool(employeeTable)', function(obj){
                if(obj.event === 'edit'){
                    openEmployeeForm('编辑员工', obj.data);
                } else if(obj.event === 'tools'){
                    openToolBindDialog(obj.data);
                } else if(obj.event === 'del'){
                    layer.confirm('确定删除该数字员工吗？', function(index){
                        $.post('/admin/employee/delete', {id: obj.data.id}, function(res){
                            if(res.code === 0){
                                layer.msg('删除成功');
                                table.reload('employeeTable');
                            } else {
                                layer.msg(res.msg);
                            }
                        });
                        layer.close(index);
                    });
                }
            });

            function openEmployeeForm(title, data){
                $.get('/admin/api/list?page=1&limit=999', function(apiRes){
                    var apiOptions = '<option value="0">-- 请选择 --</option>';
                    if(apiRes.code === 0 && apiRes.data){
                        $.each(apiRes.data, function(i, item){
                            var selected = (data.api_service_id && data.api_service_id == item.id) ? 'selected' : '';
                            apiOptions += '<option value="' + item.id + '" ' + selected + '>' + item.name + '</option>';
                        });
                    }

                    layer.open({
                        type: 1,
                        title: title,
                        area: ['650px', '600px'],
                        content: [
                            '<form class="layui-form" style="padding: 20px;">',
                            '  <input type="hidden" name="id" value="' + (data.id || '') + '">',
                            '  <div class="layui-form-item">',
                            '    <label class="layui-form-label">名称</label>',
                            '    <div class="layui-input-block">',
                            '      <input type="text" name="name" required lay-verify="required" placeholder="如：川小农" class="layui-input" value="' + (data.name || '') + '">',
                            '    </div>',
                            '  </div>',
                            '  <div class="layui-form-item">',
                            '    <label class="layui-form-label">别名</label>',
                            '    <div class="layui-input-block">',
                            '      <input type="text" name="alias" required lay-verify="required" placeholder="如：@川小农" class="layui-input" value="' + (data.alias || '') + '">',
                            '    </div>',
                            '  </div>',
                            '  <div class="layui-form-item">',
                            '    <label class="layui-form-label">分类</label>',
                            '    <div class="layui-input-block">',
                            '      <select name="category" id="selCategory">',
                            '        <option value="AI">AI</option>',
                            '        <option value="普通">普通</option>',
                            '      </select>',
                            '    </div>',
                            '  </div>',
                            '  <div class="layui-form-item">',
                            '    <label class="layui-form-label">类型</label>',
                            '    <div class="layui-input-block">',
                            '      <select name="agent_type" id="selAgentType">',
                            '        <option value="chat">chat（AI对话）</option>',
                            '        <option value="api">api（接口调用）</option>',
                            '      </select>',
                            '    </div>',
                            '  </div>',
                            '  <div class="layui-form-item" id="apiServiceGroup">',
                            '    <label class="layui-form-label">关联API</label>',
                            '    <div class="layui-input-block">',
                            '      <select name="api_service_id">' + apiOptions + '</select>',
                            '    </div>',
                            '  </div>',
                            '  <div class="layui-form-item" id="promptGroup">',
                            '    <label class="layui-form-label">Prompt</label>',
                            '    <div class="layui-input-block">',
                            '      <textarea name="prompt" placeholder="AI 提示词（仅 AI 类填写）" class="layui-textarea" style="height: 120px;">' + (data.prompt || '') + '</textarea>',
                            '    </div>',
                            '  </div>',
                            '  <div class="layui-form-item">',
                            '    <label class="layui-form-label">图标</label>',
                            '    <div class="layui-input-block">',
                            '      <input type="text" name="icon" placeholder="FontAwesome 类名，如 fa-leaf" class="layui-input" value="' + (data.icon || 'fa-robot') + '">',
                            '    </div>',
                            '  </div>',
                            '  <div class="layui-form-item">',
                            '    <label class="layui-form-label">说明</label>',
                            '    <div class="layui-input-block">',
                            '      <textarea name="description" placeholder="功能说明" class="layui-textarea">' + (data.description || '') + '</textarea>',
                            '    </div>',
                            '  </div>',
                            '  <div class="layui-form-item">',
                            '    <label class="layui-form-label">排序</label>',
                            '    <div class="layui-input-block">',
                            '      <input type="number" name="sort_order" value="' + (data.sort_order || 0) + '" class="layui-input">',
                            '    </div>',
                            '  </div>',
                            '  <div class="layui-form-item">',
                            '    <label class="layui-form-label">状态</label>',
                            '    <div class="layui-input-block">',
                            '      <input type="radio" name="status" value="1" title="启用" checked>',
                            '      <input type="radio" name="status" value="0" title="禁用">',
                            '    </div>',
                            '  </div>',
                            '  <div class="layui-form-item">',
                            '    <div class="layui-input-block">',
                            '      <button class="layui-btn" lay-submit lay-filter="employeeSubmit">立即提交</button>',
                            '    </div>',
                            '  </div>',
                            '</form>'
                        ].join(''),
                        success: function(layero, index){
                            form.render();

                            if(data.id){
                                $('select[name="category"]').val(data.category || 'AI');
                                $('select[name="agent_type"]').val(data.agent_type || 'chat');
                                $('input[name="status"][value="' + (data.status !== undefined ? data.status : 1) + '"]').prop('checked', true);
                                form.render('select');
                                form.render('radio');
                            }

                            toggleFormFields();

                            $('select[name="category"]').change(toggleFormFields);
                            $('select[name="agent_type"]').change(toggleFormFields);

                            function toggleFormFields(){
                                var cat = $('select[name="category"]').val();
                                var type = $('select[name="agent_type"]').val();
                                if(cat === 'AI' && type === 'chat'){
                                    $('#promptGroup').show();
                                    $('#apiServiceGroup').hide();
                                } else {
                                    $('#promptGroup').hide();
                                    $('#apiServiceGroup').show();
                                }
                            }

                            form.on('submit(employeeSubmit)', function(formData){
                                var url = formData.field.id ? '/admin/employee/update' : '/admin/employee/add';
                                $.post(url, formData.field, function(res){
                                    if(res.code === 0){
                                        layer.msg(res.msg);
                                        layer.close(index);
                                        table.reload('employeeTable');
                                    } else {
                                        layer.msg(res.msg);
                                    }
                                });
                                return false;
                            });
                        }
                    });
                });
            }

            function openToolBindDialog(employee){
                $.when(
                    $.get('/admin/employee/tools/list?limit=100'),
                    $.get('/admin/employee/tools/bindings?employee_id=' + employee.id)
                ).done(function(toolsRes, bindRes){
                    var tools = (toolsRes[0].code === 0) ? toolsRes[0].data : [];
                    var bound = (bindRes[0].code === 0) ? bindRes[0].data : [];
                    var html = '<div style="padding:15px;">';
                    tools.forEach(function(t){
                        var checked = bound.indexOf(t.id) >= 0 ? ' checked' : '';
                        html += '<p><input type="checkbox" class="tool-cb" value="' + t.id + '"' + checked + '> ' +
                            t.name + ' <span class="layui-badge layui-bg-gray">' + t.tool_type + '</span></p>';
                    });
                    html += '</div>';
                    layer.open({
                        type: 1,
                        title: '为「' + employee.name + '」绑定工具',
                        area: ['420px', '400px'],
                        content: html,
                        btn: ['保存', '取消'],
                        yes: function(idx, layero){
                            var ids = [];
                            layero.find('.tool-cb:checked').each(function(){ ids.push(parseInt(this.value, 10)); });
                            $.post('/admin/employee/tools/bind', {
                                employee_id: employee.id,
                                tool_ids: JSON.stringify(ids)
                            }, function(res){
                                layer.msg(res.msg);
                                if (res.code === 0) layer.close(idx);
                            });
                        }
                    });
                });
            }
        });
    </script>
</body>
</html>
